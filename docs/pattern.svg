<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="288" viewBox="0 0 1200 288" role="img" aria-labelledby="title desc">
  <title id="title">Line Sorter Helper placement patterns</title>
  <desc id="desc">On straight paths: conveyor, inverted sorter, inverted sorter. At repeated turns: conveyor, regular sorter, conveyor, regular sorter.</desc>
  <rect width="1200" height="288" rx="20" fill="#101722"/>
  <rect x="10" y="10" width="1180" height="268" rx="13" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="2"/>
  <path d="M48 144h1104" stroke="#ffffff" stroke-opacity=".2" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="47" y="56" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="3">STRAIGHT LINE</text>
    <text x="47" y="93" fill="#aeb8c4" font-size="14">repeating 1 + 2 pattern</text>
    <text x="47" y="187" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="3">REPEATED TURNS</text>
    <text x="47" y="224" fill="#aeb8c4" font-size="14">a conveyor feeds each sorter</text>
  </g>
  <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">
    <text x="505" y="89">C</text><text x="635" y="89">I</text><text x="765" y="89">I</text><text x="895" y="89">C</text><text x="1025" y="89">I</text>
    <text x="505" y="217">C</text><text x="635" y="217">S</text><text x="765" y="217">C</text><text x="895" y="217">S</text><text x="1025" y="217">C</text>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="2">
    <rect x="476" y="58" width="58" height="48" rx="7"/><rect x="606" y="58" width="58" height="48" rx="7"/><rect x="736" y="58" width="58" height="48" rx="7"/><rect x="866" y="58" width="58" height="48" rx="7"/><rect x="996" y="58" width="58" height="48" rx="7"/>
    <rect x="476" y="186" width="58" height="48" rx="7"/><rect x="606" y="186" width="58" height="48" rx="7"/><rect x="736" y="186" width="58" height="48" rx="7"/><rect x="866" y="186" width="58" height="48" rx="7"/><rect x="996" y="186" width="58" height="48" rx="7"/>
  </g>
  <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" opacity=".7">
    <text x="569" y="89">→</text><text x="699" y="89">→</text><text x="829" y="89">→</text><text x="959" y="89">→</text>
    <text x="569" y="217">→</text><text x="699" y="217">→</text><text x="829" y="217">→</text><text x="959" y="217">→</text>
  </g>
</svg>
